<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variables 品牌色彩管理</title>

    <style>
        /* ========================================
       CSS Variables｜品牌色彩中央管理
    ======================================== */

        :root {
            --brand-primary: #7A8F8D;
            --text-dark: #35403F;
            --bg-soft: #F3F1EC;
        }

        /* ========================================
       基礎設定
    ======================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;

            background-color: var(--bg-soft);
            color: var(--text-dark);
            line-height: 1.6;
        }


        /* ========================================
       主要內容區塊
    ======================================== */

        .content-section {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
            padding: 40px 24px;
        }


        /* ========================================
       內容卡片
    ======================================== */

        .content-card {
            width: 100%;
            max-width: 720px;
            padding: 56px 48px;

            background-color: var(--bg-soft);
            border: 2px solid var(--brand-primary);
            border-radius: 24px;

            text-align: center;
        }


        /* ========================================
       標題
    ======================================== */

        .content-title {
            margin-bottom: 20px;

            color: var(--text-dark);
            font-size: 42px;
            font-weight: 800;
            line-height: 1.3;
        }


        /* ========================================
       內文
    ======================================== */

        .content-text {
            margin-bottom: 32px;

            color: var(--text-dark);
            font-size: 18px;
            line-height: 1.8;
        }


        /* ========================================
       按鈕
    ======================================== */

        .content-button {
            display: inline-block;

            padding: 14px 32px;

            background-color: var(--brand-primary);
            color: var(--bg-soft);

            border: 2px solid var(--brand-primary);
            border-radius: 999px;

            font-size: 16px;
            font-weight: 700;
            text-decoration: none;

            transition:
                background-color 0.3s ease,
                color 0.3s ease;
        }

        .content-button:hover {
            background-color: var(--bg-soft);
            color: var(--brand-primary);
        }


        /* ========================================
       RWD｜手機
    ======================================== */

        @media (max-width: 600px) {

            .content-section {
                padding: 24px 16px;
            }

            .content-card {
                padding: 40px 24px;
            }

            .content-title {
                font-size: 32px;
            }

            .content-text {
                font-size: 16px;
            }
        }
    </style>
</head>


<body>

    <!-- ========================================
       主要內容區塊
  ======================================== -->

    <section class="content-section">

        <div class="content-card">

            <h1 class="content-title">
                一點小想法，創造活用程式
            </h1>

            <p class="content-text">
                不需要成為專業工程師，
                透過 Vibe Coding 與 AI 協作，
                將腦中的想法一步一步變成真正可以使用的作品。
            </p>

            <a href="#" class="content-button">
                立即開始
            </a>

        </div>

    </section>

</body>

</html>
