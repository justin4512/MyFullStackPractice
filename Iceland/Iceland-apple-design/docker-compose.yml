# 冰島追極光之旅：NAS 容器部署
# 用法：把整個 Iceland 資料夾放到 NAS（例如 /volume1/docker/iceland），
#       在 Container Manager／Container Station 以「專案／應用程式」建立，或 SSH 執行 docker compose up -d
# 瀏覽：http://<NAS IP>:8088
services:
  web:
    image: nginx:1.27-alpine
    container_name: iceland-web
    ports:
      - "8088:80"            # 8088 被占用就改左邊的數字
    volumes:
      - ./:/site:ro           # 唯讀；實際公開哪些檔案由 deploy/nginx.conf 的白名單決定
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # 行程調整存檔（網頁上增減景點後，存成 NAS 的 data/plan.json，所有裝置共用）
  # 要設編輯密碼：在同一資料夾建立 .env，寫一行 EDIT_TOKEN=你的密碼，再重新部署
  api:
    image: python:3.12-alpine
    container_name: iceland-api
    working_dir: /app
    volumes:
      - ./tools:/app/tools:ro
      - ./data:/data          # 存檔與備份（data/backups/）；不會被網站公開
    environment:
      - EDIT_TOKEN=${EDIT_TOKEN:-}
    command: python3 tools/plan_api.py --port 8000 --data /data
    restart: unless-stopped

  # 每 3 小時向 GFZ 更新 Kp 地磁指數（寫入 js/kp.js）。不需要可整段刪除。
  kp-updater:
    image: python:3.12-alpine
    container_name: iceland-kp
    working_dir: /site
    volumes:
      - ./tools:/site/tools:ro
      - ./js:/site/js
    command: >
      sh -c "apk add --no-cache curl >/dev/null &&
             while true; do
               python3 tools/fetch_kp.py || echo 'Kp 更新失敗，3 小時後重試';
               sleep 10800;
             done"
    restart: unless-stopped
