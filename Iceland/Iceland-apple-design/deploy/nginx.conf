# 冰島追極光之旅：NAS 容器用 nginx 設定
# 白名單：只公開網站需要的 index.html、css/、js/、images/。
# 資料夾裡的機票、簡報、清單、tools/、data/、.claude/ 等一律 404；/api/plan 轉給存檔 API。
server {
    listen 80;
    server_name _;
    root /site;
    charset utf-8;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 首頁：每次都向伺服器確認，改版立即生效
    location = / {
        expires -1;
        try_files /index.html =404;
    }
    location = /index.html {
        expires -1;
    }

    # data.js、kp.js 會更新，不做長快取
    location ^~ /js/ {
        location ~ /\. { return 404; }
        expires -1;
    }
    location ^~ /css/ {
        location ~ /\. { return 404; }
        expires 1d;
    }
    location ^~ /images/ {
        location ~ /\. { return 404; }   # 擋掉 macOS 複製時產生的 ._ 檔
        expires 30d;
    }

    # 行程調整存檔 API（tools/plan_api.py，容器 api）
    location = /api/plan {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2m;
        proxy_read_timeout 15s;
    }
    location = /api/health {
        proxy_pass http://api:8000;
    }

    # 其他所有路徑（機票、簡報、清單、tools/ 等）不公開
    location / {
        return 404;
    }
}
