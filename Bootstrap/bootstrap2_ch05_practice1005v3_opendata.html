<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格(table)loop練習</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="../PageCut/css/myAll.css">
    <style>
        .scroll-box {
            display: block;
            max-height: 215px;
            overflow-y: auto;
            word-break: break-all;
        }

        @media screen and (max-width: 768px){
            .table-rwd thead{
                display: none;
            }
            .table-rwd tbody tr{
                display: block;
                border: 5px solid var(--text-light);
                margin-top: 15px;
                border-radius: 10px;
                box-shadow: 2px 2px 2px 2px var(--shadow03);
            }
            .table-rwd tbody tr td{
                display: block;
                display: block;
                overflow: hidden;
            }
            .table-rwd tbody tr td::before {
                content: attr(data-th) " : ";
                font-weight: bold;
                width: 15%;
                float: left;
                text-align: right;
                padding-right: 15px;
            }
            .table-rwd tbody tr td span.table-col{
                width: 85%;
                float: left;
            }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="display-1 fw-100 text-center">CH5. 表格(table)&Opendata練習 - RWD</div>
        <table class="table table-bordered table-rwd">
            <thead>
                <tr>
                    <th width="5%">編號</th>
                    <th width="10%">景點名稱</th>
                    <th width="12%">景點地址</th>
                    <th width="3%">電話</th>
                    <th width="20%">景點圖示</th>                    
                    <th width="50%">景點描述</th>
                </tr>
            </thead>
            <tbody id="mytbody">
                <tr>
                    <td data-th="編號"><span class="table-col">XX</span></td>
                    <td data-th="景點名稱"><span class="table-col">XX</span></td>
                    <td data-th="景點地址"><span class="table-col">XX</span></td>
                    <td data-th="電話"><span class="table-col">XX</span></td>
                    <td data-th="景點圖示"><span class="table-col">XX</span></td>
                    <td data-th="景點描述"><span class="table-col">XX</span></td>
                </tr>
            </tbody>
        </table>

        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/jquery-4.0.0.js"></script>
        <script src="js/travelFoodloop.js" defer></script>
        <script src="js/travelFood.js"></script>
        <script>
            console.log(food);
        </script>
                
    </div>
</body>
</html>
