        c<div class="row">
            <div class="col-3 offset-lg-9">

            </div>
        </div>
        <div class="display-5 fw-900 my-4 ">3-1.切版練習(Offset)-左右格子位移</div>
        <div class="row">
            <!-- 第1種位移方式：透過offset-數字去設定位置 -->
            <div class="col-3 offset-lg-9">
                <div class="box01 bg-warning"></div>
            </div>
        </div>
        <hr>
        
        <!-- 第2種位移方式:透過col-md-4先設定好格子及位置，再使用d-none d-md-block去開關格子 -->
        <div class="row">
            <!-- col-md-4代表在md(768px)銀幕尺寸以下時，佔4格-->
            <div class="col-md-4"> 
                <div class="box01 bg-primary"></div>
            </div>
            <!-- d-none d-md-block代表在md(768px)銀幕尺寸以下時，預設隱藏，在md(768px)銀幕尺寸以上時，顯示-->
            <div class="col-md-4 d-none d-md-block">
                <div class="box01 bg-danger"></div>
            </div>
            <!-- d-none d-md-block代表在md(768px)銀幕尺寸以下時，預設隱藏，在md(768px)銀幕尺寸以上時，才顯示-->
            <div class="col-md-4 d-none d-md-block">
                <div class="box01 bg-danger"></div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 offset-md-4">
                <div class="box01 bg-primary"></div>
            </div>
            <div class="col-md-4 d-none d-md-block">
                <div class="box01 bg-danger"></div>
            </div>

        </div>
        <div class="row">
            <div class="col-md-4 offset-md-8"> 
                <div class="box01 bg-primary"></div>
            </div>
        </div>

        <div class="display-5 fw-900 my-4 ">4.切版練習(Gutter)</div>
        <!-- gx-1 水平間距為1，gy-4 垂直間距為4 -->
