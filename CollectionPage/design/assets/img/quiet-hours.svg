<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- 示意截圖：Quiet Hours 計時中。背景隨進度由冷色漸變為暖色，畫面上沒有進度條與連續天數。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3557"/>
      <stop offset=".45" stop-color="#3d6b8a"/>
      <stop offset=".8" stop-color="#c98b6b"/>
      <stop offset="1" stop-color="#e8b48a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".48" r=".45">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <text x="72" y="92" font-size="28" font-weight="500" fill-opacity=".78">Quiet Hours</text>
  <text x="1528" y="92" font-size="22" text-anchor="end" fill-opacity=".62">結束時不會發出聲音</text>

  <text x="800" y="560" font-size="240" font-weight="300" text-anchor="middle" fill-opacity=".94" letter-spacing="-6">18:42</text>
  <text x="800" y="628" font-size="30" text-anchor="middle" fill-opacity=".7">剩餘時間</text>

  <rect x="652" y="812" width="136" height="56" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"/>
  <text x="720" y="849" font-size="24" text-anchor="middle" fill-opacity=".85">暫停</text>
  <rect x="812" y="812" width="136" height="56" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"/>
  <text x="880" y="849" font-size="24" text-anchor="middle" fill-opacity=".85">結束</text>
</svg>
