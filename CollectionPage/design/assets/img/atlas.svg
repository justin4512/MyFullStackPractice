<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- 示意截圖：Atlas 同步衝突解決。左右並列裝置端與伺服器端的同一筆記錄，差異欄位以底色標示，下方為選擇與註記區。 -->
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
      .ink { fill: #1f2a27; } .sub { fill: #5b6b66; } .faint { fill: #8a9a94; }
      .card { fill: #ffffff; stroke: #dde5e2; stroke-width: 2; }
      .diff { fill: #fdf0c8; }
      .rule { stroke: #e6ecea; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#eef2f0"/>

  <!-- 頂列 -->
  <rect width="1600" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1600" y2="72" class="rule"/>
  <rect x="48" y="22" width="28" height="28" rx="7" fill="#0f766e"/>
  <text x="92" y="45" font-size="24" font-weight="600" class="ink">Atlas</text>
  <text x="190" y="45" font-size="20" class="sub">同步衝突 1 / 3 · 樣區 A-17</text>
  <rect x="1330" y="20" width="222" height="32" rx="16" fill="#fdf0c8"/>
  <text x="1441" y="42" font-size="16" text-anchor="middle" fill="#8a5206">2 個欄位不一致</text>

  <!-- 裝置端 -->
  <rect x="48" y="104" width="740" height="520" rx="16" class="card"/>
  <text x="80" y="152" font-size="22" font-weight="600" class="ink">裝置端（離線記錄）</text>
  <text x="80" y="182" font-size="16" class="faint">2024-10-12 14:03 · 調查員 林</text>
  <line x1="64" y1="208" x2="772" y2="208" class="rule"/>
  <text x="80" y="250" font-size="17" class="sub">樣區編號</text>
  <text x="300" y="250" font-size="19" class="ink">A-17</text>
  <line x1="64" y1="276" x2="772" y2="276" class="rule"/>
  <rect x="64" y="278" width="708" height="66" class="diff"/>
  <text x="80" y="318" font-size="17" class="sub">物種</text>
  <text x="300" y="318" font-size="19" class="ink">台灣杉（幼樹 3 株）</text>
  <line x1="64" y1="344" x2="772" y2="344" class="rule"/>
  <text x="80" y="386" font-size="17" class="sub">胸高直徑</text>
  <text x="300" y="386" font-size="19" class="ink">42 cm</text>
  <line x1="64" y1="412" x2="772" y2="412" class="rule"/>
  <rect x="64" y="414" width="708" height="194" class="diff"/>
  <text x="80" y="454" font-size="17" class="sub">現場註記</text>
  <text x="300" y="454" font-size="19" class="ink">北側坡面有新崩塌痕跡，</text>
  <text x="300" y="486" font-size="19" class="ink">幼樹位於崩塌線下方約 2 公尺，</text>
  <text x="300" y="518" font-size="19" class="ink">建議下季複查。</text>
  <rect x="300" y="546" width="150" height="40" rx="8" fill="#e2ece9"/>
  <text x="375" y="572" font-size="15" text-anchor="middle" class="sub">附照片 2 張</text>

  <!-- 伺服器端 -->
  <rect x="812" y="104" width="740" height="520" rx="16" class="card"/>
  <text x="844" y="152" font-size="22" font-weight="600" class="ink">伺服器端</text>
  <text x="844" y="182" font-size="16" class="faint">2024-10-12 16:47 · 由匯入作業更新</text>
  <line x1="828" y1="208" x2="1536" y2="208" class="rule"/>
  <text x="844" y="250" font-size="17" class="sub">樣區編號</text>
  <text x="1064" y="250" font-size="19" class="ink">A-17</text>
  <line x1="828" y1="276" x2="1536" y2="276" class="rule"/>
  <rect x="828" y="278" width="708" height="66" class="diff"/>
  <text x="844" y="318" font-size="17" class="sub">物種</text>
  <text x="1064" y="318" font-size="19" class="faint">未記錄</text>
  <line x1="828" y1="344" x2="1536" y2="344" class="rule"/>
  <text x="844" y="386" font-size="17" class="sub">胸高直徑</text>
  <text x="1064" y="386" font-size="19" class="ink">42 cm</text>
  <line x1="828" y1="412" x2="1536" y2="412" class="rule"/>
  <rect x="828" y="414" width="708" height="194" class="diff"/>
  <text x="844" y="454" font-size="17" class="sub">現場註記</text>
  <text x="1064" y="454" font-size="19" class="faint">（空白）</text>

  <!-- 選擇與註記 -->
  <rect x="48" y="656" width="1504" height="296" rx="16" class="card"/>
  <text x="80" y="704" font-size="20" font-weight="600" class="ink">選擇要保留的版本</text>
  <rect x="80" y="730" width="300" height="56" rx="10" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
  <circle cx="112" cy="758" r="11" fill="none" stroke="#0f766e" stroke-width="2"/>
  <circle cx="112" cy="758" r="6" fill="#0f766e"/>
  <text x="136" y="765" font-size="18" class="ink">保留裝置端版本</text>
  <rect x="396" y="730" width="300" height="56" rx="10" fill="#ffffff" stroke="#cfd9d5" stroke-width="2"/>
  <circle cx="428" cy="758" r="11" fill="none" stroke="#8a9a94" stroke-width="2"/>
  <text x="452" y="765" font-size="18" class="ink">保留伺服器端版本</text>
  <rect x="712" y="730" width="240" height="56" rx="10" fill="#ffffff" stroke="#cfd9d5" stroke-width="2"/>
  <circle cx="744" cy="758" r="11" fill="none" stroke="#8a9a94" stroke-width="2"/>
  <text x="768" y="765" font-size="18" class="ink">逐欄合併</text>
  <text x="80" y="830" font-size="17" class="sub">註記：為什麼選這個版本</text>
  <rect x="80" y="846" width="1080" height="76" rx="10" fill="#f7faf9" stroke="#cfd9d5" stroke-width="2"/>
  <text x="104" y="892" font-size="18" class="ink">伺服器端是匯入舊表單時覆寫的，現場記錄才是當天的實際觀察。</text>
  <rect x="1300" y="858" width="220" height="56" rx="10" fill="#0f766e"/>
  <text x="1410" y="893" font-size="19" font-weight="600" text-anchor="middle" fill="#ffffff">確認並同步</text>
</svg>
