<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待辦清單</title>
  <style>
    body{font-family:Arial,sans-serif;background:#eef2ff;margin:0;padding:32px 16px}.container{max-width:600px;margin:0 auto;background:#fff;padding:24px;border-radius:12px;border:1px solid #e5e7eb}
    form{display:flex;gap:8px;margin-bottom:20px}input{flex:1;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px}button{padding:10px 16px;border:0;border-radius:8px;background:#4f46e5;color:#fff;cursor:pointer}
    li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #e5e7eb}
  </style>
</head>
<body>
  <main class="container">
    <h1>待辦清單</h1>
    <form id="todoForm">
      <input id="todoInput" type="text" placeholder="輸入待辦事項">
      <button type="submit">新增</button>
    </form>
    <ul id="todoList"></ul>
  </main>
  <script>
    const todoForm=document.getElementById('todoForm');
    const todoInput=document.getElementById('todoInput');
    const todoList=document.getElementById('todoList');
    let todos=JSON.parse(localStorage.getItem('todos'))||[];
    function render(){
      todoList.innerHTML='';
      todos.forEach((todo,index)=>{
        const li=document.createElement('li');
        const span=document.createElement('span');
        span.textContent=todo.text;
        if(todo.done) span.style.textDecoration='line-through';
        const doneButton=document.createElement('button');
        doneButton.textContent=todo.done?'取消完成':'完成';
        doneButton.addEventListener('click',()=>{todos[index].done=!todos[index].done;localStorage.setItem('todos',JSON.stringify(todos));render()});
        const deleteButton=document.createElement('button');
        deleteButton.textContent='刪除';deleteButton.style.marginLeft='8px';
        deleteButton.addEventListener('click',()=>{todos.splice(index,1);localStorage.setItem('todos',JSON.stringify(todos));render()});
        li.appendChild(span);li.appendChild(doneButton);li.appendChild(deleteButton);todoList.appendChild(li);
      });
    }
    todoForm.addEventListener('submit',(event)=>{event.preventDefault();const text=todoInput.value.trim();if(!text)return;todos.push({text,done:false});localStorage.setItem('todos',JSON.stringify(todos));todoInput.value='';render()});
    render();
  </script>
</body>
</html>
