<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>表單送出失敗範例</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;padding:32px 16px}
    .container{max-width:480px;margin:0 auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
    form{display:grid;gap:16px}label{display:grid;gap:6px;font-size:14px}input,button{font:inherit}
    input{padding:10px 12px;border:1px solid #d1d5db;border-radius:8px}
    button{padding:12px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
    #message{min-height:24px;margin-top:16px}
  </style>
</head>
<body>
  <main class="container">
    <h1>會員註冊</h1>
    <form id="signupForm">
      <label>姓名<input id="name" type="text" placeholder="請輸入姓名"></label>
      <label>Email<input id="email" type="email" placeholder="請輸入 Email"></label>
      <label>密碼<input id="password" type="password" placeholder="請輸入密碼"></label>
      <button type="submit">送出</button>
    </form>
    <p id="message"></p>
  </main>
  <script>
    const form=document.getElementById('signupForm');
    const nameInput=document.getElementById('name');
    const emailInput=document.getElementById('email');
    const passwordInput=document.getElementById('password');
    const message=document.getElementById('message');

    // BUG: 忘了綁定 submit 事件
    function handleSubmit(event){
      event.preventDefault();
      const name=nameInput.value.trim();
      const email=emailInput.value.trim();
      const password=passwordInput.value.trim();
      if(!name||!email||!password){
        message.textContent='請填寫完整資料';
        message.style.color='#dc2626';
        return;
      }
      message.textContent='送出中...';
      message.style.color='#374151';
      setTimeout(()=>{
        message.textContent='註冊成功';
        message.style.color='#15803d';
        form.reset();
      },800);
    }

    // 修正：綁定 submit 事件
    form.addEventListener('submit', handleSubmit);
  </script>
</body>
</html>
