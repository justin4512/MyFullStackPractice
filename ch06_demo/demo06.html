<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>圖片效能範例</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f8fafc;margin:0;padding:32px 16px}.container{max-width:1000px;margin:0 auto}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}figure{margin:0}
    img{width:100%;height:auto;display:block;border-radius:12px;background:#e5e7eb}figcaption{margin-top:8px;color:#6b7280;font-size:14px}
  </style>
</head>
<body>
  <main class="container">
    <h1>圖片牆</h1>
    <div class="gallery">
      <figure><img src="https://picsum.photos/800/500?random=1" width="800" height="500" alt="圖片 1"><figcaption>圖片 1</figcaption></figure>
      <figure><img src="https://picsum.photos/800/500?random=2" width="800" height="500" alt="圖片 2"><figcaption>圖片 2</figcaption></figure>
      <figure><img src="https://picsum.photos/800/500?random=3" width="800" height="500" loading="lazy" alt="圖片 3"><figcaption>圖片 3</figcaption></figure>
      <figure><img src="https://picsum.photos/800/500?random=4" width="800" height="500" loading="lazy" alt="圖片 4"><figcaption>圖片 4</figcaption></figure>
      <figure><img src="https://picsum.photos/800/500?random=5" width="800" height="500" loading="lazy" alt="圖片 5"><figcaption>圖片 5</figcaption></figure>
      <figure><img src="https://picsum.photos/800/500?random=6" width="800" height="500" loading="lazy" alt="圖片 6"><figcaption>圖片 6</figcaption></figure>
    </div>
  </main>
</body>
</html>
