<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API 載入失敗範例</title>
  <style>
    body{font-family:Arial,sans-serif;background:#fafafa;margin:0;padding:32px 16px}
    .container{max-width:760px;margin:0 auto;background:#fff;padding:24px;border-radius:12px;border:1px solid #e5e7eb}
    button{padding:10px 14px;border:0;border-radius:8px;background:#0f766e;color:#fff;cursor:pointer}
    #status{margin:16px 0;color:#6b7280}li{padding:12px 0;border-bottom:1px solid #e5e7eb}
  </style>
</head>
<body>
  <main class="container">
    <h1>文章列表</h1>
    <button id="reloadBtn">重新載入</button>
    <div id="status"></div>
    <ul id="postList"></ul>
  </main>
  <script>
    const reloadBtn=document.getElementById('reloadBtn');
    const statusEl=document.getElementById('status');
    const postList=document.getElementById('postList');
    async function loadPosts(){
      statusEl.textContent='載入中...';
      postList.innerHTML='';
      try{
        const response=await fetch('https://jsonplaceholder.typicode.com/posts');
        // BUG: 把 response.json() 寫成錯誤的屬性存取，導致資料永遠是 undefined
        const posts=await response.body;
        statusEl.textContent=`成功載入 ${posts.length} 筆資料`;
        postList.innerHTML=posts.slice(0,10).map(post=>`<li><strong>${post.title}</strong><p>${post.body}</p></li>`).join('');
      }catch(error){
        statusEl.textContent='資料載入失敗';
        console.error(error);
      }
    }
    reloadBtn.addEventListener('click',loadPosts);
    loadPosts();
  </script>
</body>
</html>
