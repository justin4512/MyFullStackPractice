<!DOCTYPE html>

<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>JavaScript 表單驗證</title>

<style>
    body {
        font-family: Arial, "Microsoft JhengHei", sans-serif;
        background-color: #f4f6f8;
        margin: 0;
        padding: 50px 20px;
    }

    .login-form {
        max-width: 400px;
        margin: 0 auto;
        padding: 30px;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .form-title {
        margin-top: 0;
        text-align: center;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    .form-input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        box-sizing: border-box;
    }

    .submit-button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background-color: #333;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .submit-button:hover {
        opacity: 0.85;
    }

    .error-message {
        margin-top: 15px;
        color: red;
        font-weight: bold;
    }

    .success-message {
        margin-top: 15px;
        color: green;
        font-weight: bold;
    }
</style>


</head>

<body>


<form id="login-form" class="login-form">

    <h1 class="form-title">
        登入
    </h1>

    <div class="form-group">

        <label
            class="form-label"
            for="username"
        >
            帳號
        </label>

        <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            placeholder="請輸入帳號"
        >

    </div>


    <div class="form-group">

        <label
            class="form-label"
            for="password"
        >
            密碼
        </label>

        <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="請輸入密碼"
        >

    </div>


    <button
        class="submit-button"
        type="submit"
    >
        登入
    </button>


    <!-- JavaScript 動態產生訊息的位置 -->
    <div
        class="message"
        aria-live="polite"
    ></div>

</form>


<script>

    // ==========================================
    // 1. 找到表單
    // ==========================================

    const loginForm = document.querySelector("#login-form");


    // ==========================================
    // 2. 監聽 submit 事件
    // ==========================================

    loginForm.addEventListener("submit", function (event) {

        // ======================================
        // 3. 阻止表單預設行為
        // ======================================

        event.preventDefault();


        // ======================================
        // 4. 取得 username 和 password
        // ======================================

        const username = document.querySelector("#username").value;

        const password = document.querySelector("#password").value;


        // 找到顯示訊息的區域
        const message = document.querySelector(".message");


        // ======================================
        // 5. 清除上一則訊息
        // ======================================

        message.textContent = "";

        message.className = "message";


        // ======================================
        // 6. 密碼驗證
        // ======================================

        if (password.length <= 6) {

            // 不符合條件
            message.textContent =
                "⚠️ 密碼必須大於 6 位數";

            message.classList.add("error-message");

            return;
        }


        // ======================================
        // 7. 驗證成功
        // ======================================

        console.log(
            `登入成功！歡迎 ${username}`
        );


        // 畫面也顯示成功訊息
        message.textContent =
            "✅ 登入成功！";

        message.classList.add("success-message");

    });

</script>


</body>

</html>
